name: Salary visual layout QA
on:
  push:
    branches:
      - design-refresh-20261031
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local read-only web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ratibi-design-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/salary/ >/dev/null && break; sleep 1; done
      - name: Run responsive screenshot and overflow checks
        run: node tests/design-smoke.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratibi-visual-review
          path: design-artifacts/*.png
          if-no-files-found: warn
